<title>침묵의 증거 진행표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F2EE; --panel:#FBFBF9; --panel2:#E9EBE5; --sunk:#E3E6DE;
  --ink:#15181B; --ink2:#4C555C; --ink3:#7B858B;
  --line:#D6DBD2; --line2:#BFC7B9;
  --acc:#1F4E4A; --acc2:#2E7168; --accSoft:#E0EAE6;
  --pro:#B0433C; --proSoft:#F6E6E4;
  --def:#3A6EA8; --defSoft:#E3EBF4;
  --warn:#A2681A; --warnSoft:#F7EEDD;
  --ok:#3F7340; --okSoft:#E6EFE4;
  --sans:"IBM Plex Sans KR",'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --serif:"Nanum Myeongjo",'Apple SD Gothic Neo',serif;
  --r:4px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1112; --panel:#171B1D; --panel2:#1F2426; --sunk:#101415;
  --ink:#E8EAE6; --ink2:#A6AFB2; --ink3:#7C868A;
  --line:#282F31; --line2:#3A4346;
  --acc:#67B0A3; --acc2:#84C6BA; --accSoft:#172A28;
  --pro:#DE7A70; --proSoft:#2C1C1A;
  --def:#6EA3DC; --defSoft:#161F2B;
  --warn:#D3982F; --warnSoft:#2A2214;
  --ok:#71B06F; --okSoft:#17251A;
}}
:root[data-theme="dark"]{
  --bg:#0E1112; --panel:#171B1D; --panel2:#1F2426; --sunk:#101415;
  --ink:#E8EAE6; --ink2:#A6AFB2; --ink3:#7C868A;
  --line:#282F31; --line2:#3A4346;
  --acc:#67B0A3; --acc2:#84C6BA; --accSoft:#172A28;
  --pro:#DE7A70; --proSoft:#2C1C1A;
  --def:#6EA3DC; --defSoft:#161F2B;
  --warn:#D3982F; --warnSoft:#2A2214;
  --ok:#71B06F; --okSoft:#17251A;
}
/* 무대 모드 — 암전 중 객석 광원을 최소화하는 부스등 팔레트. 테마보다 우선한다. */
:root[data-stage="on"]{
  --bg:#0A0505; --panel:#140A0A; --panel2:#1B0E0E; --sunk:#080404;
  --ink:#F0C9C2; --ink2:#C08A82; --ink3:#8E625C;
  --line:#2A1413; --line2:#42201E;
  --acc:#E8837A; --acc2:#F4A79F; --accSoft:#22100F;
  --pro:#F0928A; --proSoft:#25100F;
  --def:#C98A84; --defSoft:#1E100F;
  --warn:#E0A24A; --warnSoft:#241708;
  --ok:#C7907F; --okSoft:#1F1210;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}

/* header */
header{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
.hbar{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0}
.brand b{font-family:var(--serif);font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:var(--r);border:1px solid var(--line)}
.tabs button{background:none;border:0;padding:6px 13px;border-radius:2px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs button:hover:not([aria-selected="true"]){color:var(--ink)}
.hbtns{display:flex;gap:6px;align-items:center}

/* generic controls */
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
.btn.pri:hover{background:var(--acc2);border-color:var(--acc2);color:var(--bg)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger:hover{border-color:var(--pro);color:var(--pro)}
.btn[aria-pressed="true"]{background:var(--accSoft);border-color:var(--acc);color:var(--acc)}
input[type=text],input[type=number],select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:3px;padding:5px 8px;font-size:13px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label.f{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}

main{max-width:1240px;margin:0 auto;padding:20px 18px 100px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.panel>h2{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-.005em}
.panel>h2+.sub{margin:0 0 16px;font-size:13px;color:var(--ink2);max-width:74ch}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{background:var(--panel2);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}
.hint{font-size:12.5px;color:var(--ink3);margin:8px 0 0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 7px;border-radius:2px;white-space:nowrap}
.c-pro{color:var(--pro);background:var(--proSoft)}
.c-def{color:var(--def);background:var(--defSoft)}
.c-neu{color:var(--ink3);background:var(--sunk)}
.c-ok{color:var(--ok);background:var(--okSoft)}
.c-warn{color:var(--warn);background:var(--warnSoft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* team card */
.tcard{border:1px solid var(--line);border-left:3px solid var(--tc,var(--acc));border-radius:var(--r);background:var(--panel);padding:12px 14px}
.tcard h4{margin:0 0 2px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}

/* matrix */
.mx{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.mx table{min-width:auto}
.mx th.st{writing-mode:vertical-rl;padding:9px 5px;font-size:10px;letter-spacing:.04em;text-transform:none;font-family:var(--sans);font-weight:500;white-space:nowrap;max-height:130px}
.mx td.cell{text-align:center;padding:0;width:42px;height:36px;border-left:1px solid var(--line)}
.mx td.cell i{display:block;width:100%;height:100%;line-height:36px;font-family:var(--mono);font-size:11px;font-style:normal;font-weight:600}
.seen-p{background:var(--proSoft);color:var(--pro)}
.seen-d{background:var(--defSoft);color:var(--def)}
.seen-n{background:var(--panel2);color:var(--ink2)}
.unseen{color:var(--ink3);opacity:.32}

/* lean bar */
.lean{height:22px;display:flex;border-radius:2px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.lean i{display:block;height:100%}
.lean .lp{background:var(--pro)}
.lean .ld{background:var(--def)}
.lean .ln{background:var(--line2)}

/* alerts */
.alert{display:flex;gap:11px;padding:11px 13px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:0 var(--r) var(--r) 0;background:var(--panel);margin-bottom:8px;font-size:13.5px;align-items:flex-start}
.alert.crit{border-left-color:var(--pro)}
.alert.good{border-left-color:var(--ok)}
.alert b{display:block;font-size:13.5px;margin-bottom:2px}
.alert p{margin:0;color:var(--ink2);font-size:12.5px;line-height:1.55}
.alert .ic{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:2px;flex:none;margin-top:1px}

/* run mode */
.clock{font-family:var(--mono);font-size:clamp(44px,11vw,84px);font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.clock.over{color:var(--pro)}
.stage-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.stage-strip .sc{flex:none;min-width:132px;border:1px solid var(--line);border-left:3px solid var(--tc,var(--acc));border-radius:var(--r);padding:10px 12px;background:var(--panel)}
.stage-strip .sc .tn{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.stage-strip .sc .sn{font-size:15px;font-weight:600;margin-top:5px;line-height:1.3}
.stage-strip .sc .ev{font-size:11.5px;color:var(--ink3);margin-top:3px}

.phase{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.phase button{flex:1;min-width:104px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:9px 8px;text-align:center;cursor:pointer}
.phase button[aria-pressed="true"]{background:var(--accSoft);border-color:var(--acc)}
.phase button b{display:block;font-size:13.5px;font-weight:600}
.phase button small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:2px}

.verdict{background:var(--sunk);border:1px solid var(--line2);border-radius:var(--r);padding:22px;text-align:center}
.verdict .vl{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.verdict .vv{font-family:var(--serif);font-weight:800;font-size:clamp(32px,7vw,56px);line-height:1.1;margin:8px 0 4px}
.verdict .vv.g{color:var(--pro)}
.verdict .vv.ng{color:var(--def)}
.verdict .vv.tie{color:var(--warn)}
.verdict .vs{font-family:var(--mono);font-size:14px;color:var(--ink2)}

.votebar{height:34px;display:flex;border-radius:2px;overflow:hidden;border:1px solid var(--line2);margin:12px 0 6px}
.votebar i{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;min-width:0;overflow:hidden}
.votebar .vg{background:var(--pro)}
.votebar .vn{background:var(--def)}

.trace{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.trace .tstep{display:flex;align-items:center;gap:8px}
.trace .tbox{border:1px solid var(--line2);border-radius:var(--r);padding:7px 12px;text-align:center;min-width:92px}
.trace .tbox small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.trace .tbox b{display:block;font-size:15px;font-weight:600;margin-top:2px}
.trace .arw{color:var(--ink3);padding:0 9px;font-size:15px}

dialog{border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg-b{padding:18px}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
textarea.code{font-family:var(--mono);font-size:11px;height:160px;resize:vertical;line-height:1.45;word-break:break-all}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.3)}
:root[data-stage="on"] .toast{background:var(--panel2);color:var(--ink);border:1px solid var(--line2)}

.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:700px){
  main{padding:14px 12px 90px}
  .panel{padding:14px}
  .hbar{padding:9px 12px;gap:9px}
  .brand span{display:none}
}
</style><style>
/* 개정판 추가 스타일 */
.tlbar{display:flex;height:46px;border-radius:2px;overflow:hidden;border:1px solid var(--line2);margin:14px 0 8px}
.tlbar i{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;font-weight:600;color:#FBFBF9;overflow:hidden;white-space:nowrap;font-style:normal}
.sg-a{background:#5C6B72}.sg-b{background:#7E8A6A}.sg-c{background:var(--acc)}.sg-d{background:#8C4A44}.sg-e{background:#6B5B8A}
:root[data-stage="on"] .tlbar i{color:#1A0B0B}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink2)}
.leg span{display:flex;align-items:center;gap:7px}.leg i{width:10px;height:10px;border-radius:2px;flex:none}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:14px 0}
.kpi div{background:var(--panel);padding:13px 15px}
.kpi dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.kpi dd{margin:0;font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi dd small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:400;color:var(--ink3);margin-top:3px;letter-spacing:0}
.ok{color:var(--ok)}.no{color:var(--pro)}
.quote{background:var(--sunk);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:0 var(--r) var(--r) 0;padding:15px 17px;margin:14px 0;font-family:var(--serif);font-size:16px;line-height:1.65}
.pickrow{display:grid;grid-template-columns:38px 1fr 92px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.pickrow:last-child{border-bottom:none}
.pickrow .no2{font-family:var(--mono);font-size:13px;color:var(--ink3);text-align:center}
.pbar{height:9px;background:var(--sunk);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%}
.adopted{outline:2px solid var(--acc);outline-offset:2px;border-radius:2px}
</style>

<header>
  <div class="hbar">
    <div class="brand"><b>침묵의 증거</b><span>공연 진행표 · 개정판</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-view="plan" aria-selected="true">구성</button>
      <button role="tab" data-view="money" aria-selected="false">경제성</button>
      <button role="tab" data-view="run" aria-selected="false">운영</button>
      <button role="tab" data-view="cue" aria-selected="false">인솔 큐</button>
    </div>
    <div class="hbtns">
      <button class="btn sm" id="stageBtn" aria-pressed="false" title="암전 중 객석 광원을 줄이는 부스등 팔레트">무대 모드</button>
      <button class="btn sm" id="shareBtn">공유·백업</button>
    </div>
  </div>
</header>
<main>
  <div id="v-plan"></div>
  <div id="v-money" class="hide"></div>
  <div id="v-run" class="hide"></div>
  <div id="v-cue" class="hide"></div>
</main>

<dialog id="shareDlg">
  <div class="dlg-h"><span>공유 · 백업</span><button class="btn sm" data-close>닫기</button></div>
  <div class="dlg-b">
    <p style="margin:0 0 12px;font-size:13px;color:var(--ink2)">배포 코드를 복사해 인솔자에게 보내면, 같은 링크를 열고 붙여넣어 동일한 구성을 받습니다. 서버가 없어 자동 동기화는 되지 않습니다.</p>
    <label class="f">배포 코드</label>
    <textarea class="code" id="codeOut" readonly></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="copyCode">코드 복사</button>
      <button class="btn" id="dlJson">JSON 파일로 저장</button>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <label class="f">코드 불러오기</label>
    <textarea class="code" id="codeIn" placeholder="배포 코드를 붙여넣으십시오"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn pri" id="loadCode">불러오기</button>
      <button class="btn danger" id="resetAll">기본 구성으로 초기화</button>
    </div>
  </div>
</dialog>

<script>
"use strict";
/* ============================================================
   침묵의 증거 — 공연 진행표 (1차 심사 반영 개정판)
   쇼케이스 2팀 구조 복귀 · 조사관 카드 집계 · 손익분기 계산
   상태는 이 기기의 localStorage에만 저장된다. 서버 없음.
   ============================================================ */
var LS = "sv.tribunal.v2";
var SIDE_C = { pro:"#B0433C", def:"#3A6EA8" };

function defaults(){
  return {
    cfg:{ enterMin:8, briefMin:3, investMin:7, trialMin:34, verdictMin:8, endingMin:15 },
    biz:{ actors:6, actorDay:250000, staff:3, staffDay:200000, venueDay:800000,
          consumDay:200000, price:35000, seats:50, shows:2 },
    teams:[
      {id:"pro", name:"검사 측 조사단", side:"pro", size:25, guide:"형사"},
      {id:"def", name:"변호인 측 조사단", side:"def", size:25, guide:"윤수(참관인)"}
    ],
    ev:[
      {id:"e1", no:"①", name:"인혜의 일기장 (마지막 장 찢김)", favors:"pro",
       note:"복수 다짐과 의도적 접근. 찢긴 흔적을 발견하면 변호 쪽으로 뒤집힌다."},
      {id:"e2", no:"②", name:"과거 정신과 진단서", favors:"pro",
       note:"3년 전 처방. 음료에서 검출된 성분과 일치."},
      {id:"e3", no:"③", name:"음료수 통 (지문·반쯤 빔)", favors:"neu",
       note:"인혜 지문. 뚜껑 열린 채 반쯤 비어 있음 — 변호 측 반격 지점."},
      {id:"e4", no:"④", name:"조각 망치 (장갑흔)", favors:"def",
       note:"두부 가격 흉기. 지문 위에 장갑흔, 크기가 일반보다 큼. 거치대에 은닉."},
      {id:"e5", no:"⑤", name:"창틀 발자국", favors:"def",
       note:"제3자의 유일한 물리적 증거. 풀버전 스토리에는 있으나 쇼케이스에는 없었음 — 신규 추가."},
      {id:"e6", no:"⑥", name:"민호의 휴대폰 (동반자살 문자)", favors:"pro",

function fix(o){ var d=defaults();
  o.cfg=Object.assign({},d.cfg,o.cfg||{}); o.biz=Object.assign({},d.biz,o.biz||{});
  o.run=Object.assign({},d.run,o.run||{}); if(!o.cast) o.cast=d.cast;

/* ---------- helpers ---------- */
function el(t,a,k){ var n=document.createElement(t);
  if(a) for(var x in a){ if(x==="class")n.className=a[x];
    else if(x==="html")n.innerHTML=a[x]; else if(x==="text")n.textContent=a[x];
    else if(x.slice(0,2)==="on")n.addEventListener(x.slice(2),a[x]);
    else if(a[x]!=null)n.setAttribute(x,a[x]); }
  (k||[]).forEach(function(c){ if(c)n.appendChild(c); }); return n; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function won(n){ return Number(n||0).toLocaleString("ko-KR"); }
function clamp(v,a,b){ v=Number(v); if(isNaN(v))v=a; return Math.max(a,Math.min(b,v)); }
function toast(m){ var t=el("div",{class:"toast",text:m}); document.body.appendChild(t);
  setTimeout(function(){t.remove();},2200); }
function favLabel(f){ return f==="pro"?"검찰 유리":f==="def"?"변호 유리":"중립"; }
function favChip(f){ return '<span class="chip '+(f==="pro"?"c-pro":f==="def"?"c-def":"c-neu")+'">'+favLabel(f)+'</span>'; }
function teamColor(t){ return SIDE_C[t.side]||"#7A62A8"; }
function totalMin(){ var c=S.cfg;
  return c.enterMin+c.briefMin+c.investMin+c.trialMin+c.verdictMin+c.endingMin; }

/* ---------- 경제성 ---------- */
function economics(o){
  var b = Object.assign({}, S.biz, o||{});
  var costDay = b.actors*b.actorDay + b.staff*b.staffDay + b.venueDay + b.consumDay;
  var shows = Math.max(1, b.shows);
  var costShow = costDay/shows;
  var revShow = b.price*b.seats;
  var bep = b.price>0 ? costShow/b.price : Infinity;
  return { costDay:costDay, costShow:costShow, revShow:revShow,
           profitShow:revShow-costShow, profitDay:(revShow-costShow)*shows,
           bep:bep, feasible: bep<=b.seats, b:b };
}

/* ---------- 카드 집계 ---------- */
function cardsOf(teamId){ return S.run.cards[teamId] || (S.run.cards[teamId]={}); }
function adoptedOf(teamId){
  var c = cardsOf(teamId);
  var rows = S.ev.map(function(e){ return {e:e, n:Number(c[e.id])||0}; });
  var total = rows.reduce(function(s,r){ return s+r.n; },0);
  rows.sort(function(a,b){ return b.n-a.n; });
  return { rows:rows, total:total, top: rows.filter(function(r){return r.n>0;}).slice(0,3) };
}
function tally(){
  var g=0,ng=0;
  S.teams.forEach(function(t){ var v=S.run.votes[t.id]||{};
    g+=Number(v.g)||0; ng+=Number(v.ng)||0; });
  var tot=g+ng;
  return {g:g,ng:ng,tot:tot, verdict: tot===0?null:(g>ng?"g":ng>g?"ng":"tie")};
}
function vWord(v){ return v==="g"?"유죄":v==="ng"?"무죄":v==="tie"?"동수":"미집계"; }

function fmt(s){ s=Math.max(0,Math.floor(s)); var m=Math.floor(s/60),x=s%60;
  return (m<10?"0":"")+m+":"+(x<10?"0":"")+x; }
function resetTimer(){ S.run.running=false; S.run.elapsed=0; S.run.startedAt=null; }
function phaseTarget(){ var c=S.cfg,p=S.run.phase;
  return p==="invest"?c.investMin : p==="cards"?3 : p==="trial"?c.trialMin : c.verdictMin; }

function renderRun(){
  var root=document.getElementById("v-run"); root.textContent="";
  var run=S.run;

  var p0=el("div",{class:"panel"});
  var ph=el("div",{class:"phase"});
  [["invest","현장 조사","STEP 1"],["cards","카드 집계","STEP 2"],
   ["trial","재판","STEP 3"],["verdict","평결","STEP 4"]].forEach(function(x){
    var b=el("button",{"aria-pressed": run.phase===x[0]?"true":"false",
      onclick:function(){ run.phase=x[0]; resetTimer(); save(); renderRun(); }});
    b.appendChild(el("b",{text:x[1]})); b.appendChild(el("small",{text:x[2]}));
    ph.appendChild(b); });
  p0.appendChild(ph);

  var tgt=phaseTarget();
  var w=el("div",{class:"row",style:"justify-content:space-between;align-items:flex-end;gap:16px"});
  var L=el("div");
  L.appendChild(el("div",{class:"mono",style:"font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)",
    text:"목표 "+tgt+"분"}));
  L.appendChild(el("div",{class:"clock"+(run.elapsed>tgt*60?" over":""),id:"clockEl",text:fmt(run.elapsed)}));
  w.appendChild(L);
  var ctl=el("div",{class:"row"});
  ctl.appendChild(el("button",{class:"btn pri",id:"playBtn",text: run.running?"일시정지":"시작",
    onclick:function(){ run.running=!run.running; if(run.running) run.startedAt=Date.now()-run.elapsed*1000; save(); renderRun(); }}));
  ctl.appendChild(el("button",{class:"btn",text:"리셋",onclick:function(){ resetTimer(); save(); renderRun(); }}));
  w.appendChild(ctl);
  p0.appendChild(w);
  root.appendChild(p0);

  if(run.phase==="invest") runInvest(root);
  else if(run.phase==="cards") runCards(root);
  else if(run.phase==="trial") runTrial(root);
  else runVerdict(root);
}

    : "변호인 측 목표: 인혜의 무죄와 제3자 가능성을 뒷받침할 증거를 고르게 한다."}));
  var ew=el("div",{class:"tw"}); var et=el("table");
  et.appendChild(el("thead",{html:"<tr><th class='c' style='width:44px'>번호</th><th style='width:28%'>증거</th><th style='width:110px'>유리한 쪽</th><th>메모</th></tr>"}));
  var eb=el("tbody");
  S.ev.forEach(function(e){
    var mine = e.favors===t.side;
    eb.appendChild(el("tr",{class: mine?"hi":"", html:
      "<td class='c mono'>"+esc(e.no)+"</td><td><b>"+esc(e.name)+"</b></td><td>"+favChip(e.favors)+
      (mine?" <span class='chip c-ok'>우리 편</span>":"")+"</td><td class='muted' style='font-size:12.5px'>"+esc(e.note||"")+"</td>"}));
  });
  et.appendChild(eb); ew.appendChild(et); p3.appendChild(ew);
  root.appendChild(p3);
}

/* ================= 공유 ================= */
function encodeShow(){
  var j=JSON.stringify({cfg:S.cfg,biz:S.biz,teams:S.teams,ev:S.ev,cast:S.cast});
  var by=new TextEncoder().encode(j), bin="";
  by.forEach(function(b){ bin+=String.fromCharCode(b); });
  return btoa(bin);
}
function decodeShow(code){
  var bin=atob(String(code).trim()), by=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) by[i]=bin.charCodeAt(i);
  var o=JSON.parse(new TextDecoder().decode(by));
  if(!o.ev||!o.teams) throw new Error("형식 오류");
  return fix({cfg:o.cfg,biz:o.biz,teams:o.teams,ev:o.ev,cast:o.cast,run:null});
}

/* ================= 배선 ================= */
function switchView(v){
  view=v;
  ["plan","money","run","cue"].forEach(function(k){
    document.getElementById("v-"+k).classList.toggle("hide", k!==v); });
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.setAttribute("aria-selected", b.dataset.view===v?"true":"false"); });
  render();
}
function render(){
  if(view==="plan") renderPlan();
  else if(view==="money") renderMoney();
  else if(view==="run") renderRun();
  else renderCue();
}
document.querySelectorAll(".tabs button").forEach(function(b){
  b.addEventListener("click",function(){ switchView(b.dataset.view); }); });

var stageBtn=document.getElementById("stageBtn");
try{ if(localStorage.getItem("sv.stage")==="1"){
  document.documentElement.setAttribute("data-stage","on");
  stageBtn.setAttribute("aria-pressed","true"); } }catch(e){}
stageBtn.addEventListener("click",function(){
  var on=document.documentElement.getAttribute("data-stage")==="on";
  if(on){ document.documentElement.removeAttribute("data-stage"); stageBtn.setAttribute("aria-pressed","false"); }
  else { document.documentElement.setAttribute("data-stage","on"); stageBtn.setAttribute("aria-pressed","true"); }
  try{ localStorage.setItem("sv.stage", on?"0":"1"); }catch(e){}
});

var dlg=document.getElementById("shareDlg");
document.getElementById("shareBtn").addEventListener("click",function(){
  document.getElementById("codeOut").value=encodeShow();
  if(typeof dlg.showModal==="function") dlg.showModal(); else dlg.setAttribute("open",""); });
dlg.querySelectorAll("[data-close]").forEach(function(b){
  b.addEventListener("click",function(){ dlg.close?dlg.close():dlg.removeAttribute("open"); }); });
document.getElementById("copyCode").addEventListener("click",function(){
  var ta=document.getElementById("codeOut"); ta.select();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(function(){toast("복사했습니다");},
      function(){toast("복사 실패 — 직접 선택해 복사하십시오");});
  } else { try{ document.execCommand("copy"); toast("복사했습니다"); }catch(e){ toast("직접 선택해 복사하십시오"); } }
});
document.getElementById("loadCode").addEventListener("click",function(){
  var v=document.getElementById("codeIn").value;
  if(!v.trim()){ toast("코드를 붙여넣으십시오"); return; }
  try{ S=decodeShow(v); cueTeam=null; save();
    document.getElementById("codeIn").value="";
    dlg.close?dlg.close():dlg.removeAttribute("open"); render(); toast("불러왔습니다");
  }catch(e){ toast("코드를 읽을 수 없습니다 — 전체를 복사했는지 확인하십시오"); }
});
document.getElementById("resetAll").addEventListener("click",function(){
  if(!confirm("현재 구성과 집계를 모두 버리고 기본 구성으로 되돌립니다. 계속할까요?")) return;
  S=defaults(); cueTeam=null; save();
  dlg.close?dlg.close():dlg.removeAttribute("open"); render(); toast("초기화했습니다");
});

var dlBtn=document.getElementById("dlJson");
dlBtn.classList.add("hide");
if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("downloads").then(function(d){
    if(!d||typeof d.save!=="function") return;
    dlBtn.classList.remove("hide");
    dlBtn.addEventListener("click",function(){
      var name="침묵의증거_구성_"+new Date().toISOString().slice(0,10)+".json";
      Promise.resolve(d.save({filename:name,data:JSON.stringify(S,null,2)})).then(
        function(){ toast("파일로 저장했습니다"); },
        function(){ toast("저장이 취소되었습니다"); });
    });
  }, function(){});
}

setInterval(function(){
  var r=S.run;
  if(r.running&&r.startedAt){
    r.elapsed=Math.floor((Date.now()-r.startedAt)/1000);
    var c=document.getElementById("clockEl");
    if(c){ c.textContent=fmt(r.elapsed);
      c.classList.toggle("over", r.elapsed>phaseTarget()*60); }
  }
},500);
setInterval(function(){ if(S.run.running) save(); },5000);

render();
