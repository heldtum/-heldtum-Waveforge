<title>침묵의 증거 재판정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F2EE; --panel:#FBFBF9; --panel2:#E9EBE5; --sunk:#E3E6DE;
  --ink:#15181B; --ink2:#4C555C; --ink3:#7B858B;
  --line:#D6DBD2; --line2:#BFC7B9;
  --acc:#1F4E4A; --acc2:#2E7168; --accSoft:#E0EAE6;
  --pro:#B0433C; --proSoft:#F6E6E4;
  --def:#3A6EA8; --defSoft:#E3EBF4;
  --warn:#A2681A; --warnSoft:#F7EEDD;
  --ok:#3F7340; --okSoft:#E6EFE4;
  --sans:"IBM Plex Sans KR",'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --serif:"Nanum Myeongjo",'Apple SD Gothic Neo',serif;
  --r:4px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1112; --panel:#171B1D; --panel2:#1F2426; --sunk:#101415;
  --ink:#E8EAE6; --ink2:#A6AFB2; --ink3:#7C868A;
  --line:#282F31; --line2:#3A4346;
  --acc:#67B0A3; --acc2:#84C6BA; --accSoft:#172A28;
  --pro:#DE7A70; --proSoft:#2C1C1A;
  --def:#6EA3DC; --defSoft:#161F2B;
  --warn:#D3982F; --warnSoft:#2A2214;
  --ok:#71B06F; --okSoft:#17251A;
}}
:root[data-theme="dark"]{
  --bg:#0E1112; --panel:#171B1D; --panel2:#1F2426; --sunk:#101415;
  --ink:#E8EAE6; --ink2:#A6AFB2; --ink3:#7C868A;
  --line:#282F31; --line2:#3A4346;
  --acc:#67B0A3; --acc2:#84C6BA; --accSoft:#172A28;
  --pro:#DE7A70; --proSoft:#2C1C1A;
  --def:#6EA3DC; --defSoft:#161F2B;
  --warn:#D3982F; --warnSoft:#2A2214;
  --ok:#71B06F; --okSoft:#17251A;
}
/* 무대 모드 — 암전 중 객석 광원을 최소화하는 부스등 팔레트. 테마보다 우선한다. */
:root[data-stage="on"]{
  --bg:#0A0505; --panel:#140A0A; --panel2:#1B0E0E; --sunk:#080404;
  --ink:#F0C9C2; --ink2:#C08A82; --ink3:#8E625C;
  --line:#2A1413; --line2:#42201E;
  --acc:#E8837A; --acc2:#F4A79F; --accSoft:#22100F;
  --pro:#F0928A; --proSoft:#25100F;
  --def:#C98A84; --defSoft:#1E100F;
  --warn:#E0A24A; --warnSoft:#241708;
  --ok:#C7907F; --okSoft:#1F1210;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}

/* header */
header{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
.hbar{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0}
.brand b{font-family:var(--serif);font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:var(--r);border:1px solid var(--line)}
.tabs button{background:none;border:0;padding:6px 13px;border-radius:2px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs button:hover:not([aria-selected="true"]){color:var(--ink)}
.hbtns{display:flex;gap:6px;align-items:center}

/* generic controls */
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
.btn.pri:hover{background:var(--acc2);border-color:var(--acc2);color:var(--bg)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger:hover{border-color:var(--pro);color:var(--pro)}
.btn[aria-pressed="true"]{background:var(--accSoft);border-color:var(--acc);color:var(--acc)}
input[type=text],input[type=number],select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:3px;padding:5px 8px;font-size:13px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label.f{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}

main{max-width:1240px;margin:0 auto;padding:20px 18px 100px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.panel>h2{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-.005em}
.panel>h2+.sub{margin:0 0 16px;font-size:13px;color:var(--ink2);max-width:74ch}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{background:var(--panel2);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}
.hint{font-size:12.5px;color:var(--ink3);margin:8px 0 0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 7px;border-radius:2px;white-space:nowrap}
.c-pro{color:var(--pro);background:var(--proSoft)}
.c-def{color:var(--def);background:var(--defSoft)}
.c-neu{color:var(--ink3);background:var(--sunk)}
.c-ok{color:var(--ok);background:var(--okSoft)}
.c-warn{color:var(--warn);background:var(--warnSoft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* team card */
.tcard{border:1px solid var(--line);border-left:3px solid var(--tc,var(--acc));border-radius:var(--r);background:var(--panel);padding:12px 14px}
.tcard h4{margin:0 0 2px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}

/* matrix */
.mx{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.mx table{min-width:auto}
.mx th.st{writing-mode:vertical-rl;padding:9px 5px;font-size:10px;letter-spacing:.04em;text-transform:none;font-family:var(--sans);font-weight:500;white-space:nowrap;max-height:130px}
.mx td.cell{text-align:center;padding:0;width:42px;height:36px;border-left:1px solid var(--line)}
.mx td.cell i{display:block;width:100%;height:100%;line-height:36px;font-family:var(--mono);font-size:11px;font-style:normal;font-weight:600}
.seen-p{background:var(--proSoft);color:var(--pro)}
.seen-d{background:var(--defSoft);color:var(--def)}
.seen-n{background:var(--panel2);color:var(--ink2)}
.unseen{color:var(--ink3);opacity:.32}

/* lean bar */
.lean{height:22px;display:flex;border-radius:2px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.lean i{display:block;height:100%}
.lean .lp{background:var(--pro)}
.lean .ld{background:var(--def)}
.lean .ln{background:var(--line2)}

/* alerts */
.alert{display:flex;gap:11px;padding:11px 13px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:0 var(--r) var(--r) 0;background:var(--panel);margin-bottom:8px;font-size:13.5px;align-items:flex-start}
.alert.crit{border-left-color:var(--pro)}
.alert.good{border-left-color:var(--ok)}
.alert b{display:block;font-size:13.5px;margin-bottom:2px}
.alert p{margin:0;color:var(--ink2);font-size:12.5px;line-height:1.55}
.alert .ic{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:2px;flex:none;margin-top:1px}

/* run mode */
.clock{font-family:var(--mono);font-size:clamp(44px,11vw,84px);font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.clock.over{color:var(--pro)}
.stage-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.stage-strip .sc{flex:none;min-width:132px;border:1px solid var(--line);border-left:3px solid var(--tc,var(--acc));border-radius:var(--r);padding:10px 12px;background:var(--panel)}
.stage-strip .sc .tn{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.stage-strip .sc .sn{font-size:15px;font-weight:600;margin-top:5px;line-height:1.3}
.stage-strip .sc .ev{font-size:11.5px;color:var(--ink3);margin-top:3px}

.phase{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.phase button{flex:1;min-width:104px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:9px 8px;text-align:center;cursor:pointer}
.phase button[aria-pressed="true"]{background:var(--accSoft);border-color:var(--acc)}
.phase button b{display:block;font-size:13.5px;font-weight:600}
.phase button small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:2px}

.verdict{background:var(--sunk);border:1px solid var(--line2);border-radius:var(--r);padding:22px;text-align:center}
.verdict .vl{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.verdict .vv{font-family:var(--serif);font-weight:800;font-size:clamp(32px,7vw,56px);line-height:1.1;margin:8px 0 4px}
.verdict .vv.g{color:var(--pro)}
.verdict .vv.ng{color:var(--def)}
.verdict .vv.tie{color:var(--warn)}
.verdict .vs{font-family:var(--mono);font-size:14px;color:var(--ink2)}

.votebar{height:34px;display:flex;border-radius:2px;overflow:hidden;border:1px solid var(--line2);margin:12px 0 6px}
.votebar i{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;min-width:0;overflow:hidden}
.votebar .vg{background:var(--pro)}
.votebar .vn{background:var(--def)}

.trace{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.trace .tstep{display:flex;align-items:center;gap:8px}
.trace .tbox{border:1px solid var(--line2);border-radius:var(--r);padding:7px 12px;text-align:center;min-width:92px}
.trace .tbox small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.trace .tbox b{display:block;font-size:15px;font-weight:600;margin-top:2px}
.trace .arw{color:var(--ink3);padding:0 9px;font-size:15px}

dialog{border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg-b{padding:18px}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
textarea.code{font-family:var(--mono);font-size:11px;height:160px;resize:vertical;line-height:1.45;word-break:break-all}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.3)}
:root[data-stage="on"] .toast{background:var(--panel2);color:var(--ink);border:1px solid var(--line2)}

.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:700px){
  main{padding:14px 12px 90px}
  .panel{padding:14px}
  .hbar{padding:9px 12px;gap:9px}
  .brand span{display:none}
}
</style>

<header>
  <div class="hbar">
    <div class="brand"><b>침묵의 증거</b><span>재판정 운영 콘솔</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-view="design" aria-selected="true">설계</button>
      <button role="tab" data-view="check" aria-selected="false">검증</button>
      <button role="tab" data-view="run" aria-selected="false">운영</button>
      <button role="tab" data-view="team" aria-selected="false">팀 뷰</button>
    </div>
    <div class="hbtns">
      <button class="btn sm" id="stageBtn" aria-pressed="false" title="암전 중 객석 광원을 줄이는 부스등 팔레트">무대 모드</button>
      <button class="btn sm" id="shareBtn">공유·백업</button>
    </div>
  </div>
</header>
<main>
  <div id="v-design"></div>
  <div id="v-check" class="hide"></div>
  <div id="v-run" class="hide"></div>
  <div id="v-team" class="hide"></div>
</main>

<dialog id="shareDlg">
  <div class="dlg-h"><span>공유 · 백업</span><button class="btn sm" data-close>닫기</button></div>
  <div class="dlg-b">
    <p style="margin:0 0 12px;font-size:13px;color:var(--ink2)">아래 <b>배포 코드</b>를 복사해 팀 인솔자에게 보내면, 인솔자가 같은 링크를 열고 코드를 붙여넣어 동일한 동선표를 받습니다. 서버가 없으므로 기기 간 자동 동기화는 되지 않습니다 — 설계를 바꾸면 코드를 다시 배포하십시오.</p>
    <label class="f">배포 코드</label>
    <textarea class="code" id="codeOut" readonly></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="copyCode">코드 복사</button>
      <button class="btn" id="dlJson">JSON 파일로 저장</button>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <label class="f">코드 불러오기 — 붙여넣고 적용</label>
    <textarea class="code" id="codeIn" placeholder="배포 코드를 여기에 붙여넣으십시오"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn pri" id="loadCode">불러오기</button>
      <button class="btn danger" id="resetAll">예시 설계로 초기화</button>
    </div>
  </div>
</dialog>

<script>
"use strict";
/* ============================================================
   침묵의 증거 — 재판정 운영 콘솔
   설계(비대칭 정보) → 검증 → 운영(3심 투표) → 팀 뷰
   상태는 이 기기의 localStorage에만 저장된다. 서버 없음.
   ============================================================ */

/* 색은 배정 입장을 나타낸다 — 검찰측은 난색, 변호측은 한색, 중립은 보라 계열.
   점 하나로 그 팀이 어느 편인지 즉시 읽히게 하기 위함이다. */
var SIDE_COLORS = { pro:["#B0433C","#C1802F","#96502A"], def:["#3A6EA8","#3F8C84","#4C5FA6"], neu:["#7A62A8","#6E8C3A","#8A6B4F"] };
var LS_KEY = "sv.tribunal.v1";

/* ---------- 예시 설계 (실제 대본으로 교체할 자리) ---------- */
function defaultShow(){
  return {
    title:"침묵의 증거",
    cfg:{ rounds:3, step:1, roundMin:7, moveMin:2, trialMin:6, voteMode:"individual" },
    teams:[
      {id:"t1", name:"제1배심", side:"pro", size:15},
      {id:"t2", name:"제2배심", side:"def", size:15},
      {id:"t3", name:"제3배심", side:"pro", size:15},
      {id:"t4", name:"제4배심", side:"def", size:15}
    ],
    stations:[
      {id:"s1", name:"12시 3분 전", place:"1관 · 거실", ev:"멈춘 벽시계", favors:"pro", w:4,
       note:"시계가 23시 57분에 멈춰 있다. 검찰이 주장하는 사망 추정 시각의 근거."},
      {id:"s2", name:"남겨진 우산", place:"2관 · 창고", ev:"주인 없는 우산", favors:"def", w:4,
       note:"집에 없어야 할 우산이 있다. 제3자가 다녀갔다는 정황."},
      {id:"s3", name:"지워진 목소리", place:"3관 · 서재", ev:"삭제된 통화 기록", favors:"pro", w:4,
       note:"사건 당일 삭제된 통화 3건. 누가 지웠는지는 이 장면에서 드러나지 않는다."},
      {id:"s4", name:"3분의 공백", place:"4관 · 현관", ev:"CCTV 3분 공백", favors:"def", w:3,
       note:"영상이 3분간 끊긴다. 변호인은 그 사이 누군가 드나들었다고 본다."},
      {id:"s5", name:"비를 맞은 사람", place:"5관 · 계단", ev:"젖은 외투", favors:"pro", w:3,
       note:"피고인의 외투가 젖어 있다. 그날 비는 23시 40분에 그쳤다."},
      {id:"s6", name:"말하지 않은 사람", place:"6관 · 복도", ev:"목격자의 침묵", favors:"def", w:3,
       note:"목격자는 무언가를 봤지만 끝내 말하지 않는다. 변호인은 그 침묵이 피고인이 아닌 누군가를 가리킨다고 주장한다."}
    ],
    trials:[
      {id:"T1", label:"1심", after:1, votes:{}, done:false},
      {id:"T2", label:"2심", after:2, votes:{}, done:false},
      {id:"T3", label:"최종심", after:3, votes:{}, done:false}
    ],
    run:{ round:1, phase:"invest", startedAt:null, elapsed:0, running:false }
  };
}

/* ---------- 상태 ---------- */
var S = load() || defaultShow();
var view = "design";
var teamViewId = null;
var timerHandle = null;

function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    var o = JSON.parse(raw);
    return (o && o.teams && o.stations) ? migrate(o) : null;
  }catch(e){ return null; }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}
function migrate(o){
  var d = defaultShow();
  o.cfg = Object.assign({}, d.cfg, o.cfg||{});
  o.run = Object.assign({}, d.run, o.run||{});
  if(!Array.isArray(o.trials) || !o.trials.length) o.trials = d.trials;
  o.trials.forEach(function(t){ if(!t.votes) t.votes = {}; });
  return o;
}

/* ---------- 유틸 ---------- */
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === "class") n.className = attrs[k];
    else if(k === "html") n.innerHTML = attrs[k];
    else if(k === "text") n.textContent = attrs[k];
    else if(k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  }
  (kids||[]).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  return fam[ord % fam.length];
}

function clamp(v,a,b){ v = Number(v); if(isNaN(v)) v = a; return Math.max(a, Math.min(b, v)); }

/* ---------- 동선 계산 (핵심) ----------
   팀 i, 라운드 r → 스테이션 (i*1 + r*step) mod S
   step=1 은 인접 이동 = 동선 충돌 없음 + 팀간 중복 최소.
   라운드 R < 스테이션 S 일 때만 비대칭이 유지된다. */
function stationIndexFor(ti, r){
  var S_ = S.stations.length;
  if(S_ === 0) return -1;
  var step = S.cfg.step || 1;
  return (ti + r * step) % S_;
}
function routeOf(ti){
  var out = [];
  for(var r = 0; r < S.cfg.rounds; r++){
    var si = stationIndexFor(ti, r);
    if(si >= 0 && S.stations[si]) out.push({ round:r+1, si:si, st:S.stations[si] });
  }
  return out;
}
function seenSet(ti){
  var s = {};
  routeOf(ti).forEach(function(x){ s[x.st.id] = true; });
  return s;
}
/* 팀의 제한된 시야가 어느 쪽으로 기우는가 */
function leanOf(ti){
  var seen = seenSet(ti), p = 0, d = 0, n = 0;
  S.stations.forEach(function(st){
    if(!seen[st.id]) return;
    var w = Number(st.w) || 1;
    if(st.favors === "pro") p += w; else if(st.favors === "def") d += w; else n += w;
  });
  var tot = p + d + n;
  return { pro:p, def:d, neu:n, total:tot, lean: tot ? (p - d) / tot : 0 };
}
function totalRuntimeMin(){
  var c = S.cfg;
  var invest = c.rounds * c.roundMin + Math.max(0, c.rounds - 1) * c.moveMin;
  var trials = S.trials.length * c.trialMin;
  return invest + trials;
}

/* ---------- 검증 규칙 ---------- */
function analyze(){
  var out = [], T = S.teams.length, St = S.stations.length, R = S.cfg.rounds, step = S.cfg.step || 1;

  if(T === 0 || St === 0){
    out.push({lv:"crit", t:"팀 또는 스테이션이 없습니다", d:"설계 탭에서 먼저 구성하십시오."});
    return out;
  }
  /* 1. 동선 충돌 */
  var collide = false, cr = 0;
  for(var r = 0; r < R; r++){
    var seenS = {};
    for(var i = 0; i < T; i++){
      var si = stationIndexFor(i, r);
      if(seenS[si]){ collide = true; cr = r + 1; break; }
      seenS[si] = true;
    }
    if(collide) break;
  }
  if(collide) out.push({lv:"crit", t:"동선 충돌 — 라운드 " + cr + "에서 두 팀이 같은 장소에 갑니다",
    d:"팀 수가 스테이션 수를 넘거나, 이동 간격이 스테이션 수와 약수를 공유합니다. 스테이션을 늘리거나 이동 간격을 1로 되돌리십시오."});
  else out.push({lv:"good", t:"동선 충돌 없음", d:"모든 라운드에서 각 팀이 서로 다른 장소에 배치됩니다. 관객이 한곳에 몰리지 않습니다."});

  /* 2. 비대칭 붕괴 — 이 기획의 생사 */
  if(R >= St) out.push({lv:"crit", t:"비대칭이 붕괴합니다 — 모든 팀이 모든 증거를 봅니다",
    d:"라운드 수(" + R + ")가 스테이션 수(" + St + ") 이상이면 팀별 시야 차이가 사라지고, 관객은 '이기려는 사람'이 아니라 '진실을 아는 사람'이 됩니다. 라운드를 " + (St-1) + "회 이하로 줄이십시오."});
  else out.push({lv:"good", t:"비대칭 유지 — 팀마다 증거 " + (St - R) + "개를 끝까지 못 봅니다",
    d:"각 팀은 " + R + "/" + St + "개만 관찰합니다. 이 차이가 '진실보다 승리'를 만드는 동력입니다."});

  /* 3. 팀 조합 중복 */
  var sig = {}, dup = [];
  S.teams.forEach(function(t, i){
    var k = Object.keys(seenSet(i)).sort().join(",");
    if(sig[k]) dup.push(sig[k] + " · " + t.name); else sig[k] = t.name;
  });
  if(dup.length) out.push({lv:"crit", t:"같은 증거 조합을 보는 팀이 있습니다",
    d:dup.join(" / ") + " — 시야가 동일하면 서로 다툴 이유가 없습니다. 이동 간격을 1로 바꾸십시오."});

  /* 4. 미사용 증거 */
  var used = {};
  S.teams.forEach(function(_, i){ Object.keys(seenSet(i)).forEach(function(k){ used[k] = 1; }); });
  var dead = S.stations.filter(function(st){ return !used[st.id]; });
  if(dead.length) out.push({lv:"warn", t:"아무 팀도 보지 않는 증거 " + dead.length + "개",
    d:dead.map(function(d){ return d.ev; }).join(", ") + " — 배우가 공연하는데 관객이 없습니다. 스테이션을 줄이거나 라운드를 늘리십시오."});

  /* 5. 모든 팀이 본 증거 = 논쟁 소멸 지점 */
  var common = S.stations.filter(function(st){
    return S.teams.every(function(_, i){ return seenSet(i)[st.id]; });
  });
  if(common.length && S.teams.length > 1) out.push({lv:"warn", t:"모든 팀이 공유하는 증거 " + common.length + "개",
    d:common.map(function(c){ return c.ev; }).join(", ") + " — 공유 증거는 논쟁의 공통 기반이 되므로 1~2개는 유익하지만, 많아지면 팀 차이가 흐려집니다."});

  /* 6. 팀별 편향 진단 */
  var okTeams = [];
  S.teams.forEach(function(t, i){
    var L = leanOf(i);
    var mag = Math.abs(L.lean);
    if(L.total === 0){
      out.push({lv:"crit", t:t.name + " — 관찰하는 증거가 없습니다", d:"라운드 수를 확인하십시오."});
      return;
    }
    if(mag < 0.15){
      out.push({lv:"warn", t:t.name + " — 시야가 너무 균형적입니다 (편향 " + (L.lean*100).toFixed(0) + "%)",
        d:"양쪽 증거를 고르게 봐서 확신이 생기지 않습니다. 이 팀은 승부욕 대신 관망에 머무를 가능성이 큽니다. 이 팀의 경로에 한쪽 증거를 더 배치하십시오."});
    } else if(t.side !== "neu"){
      var aligned = (t.side === "pro" && L.lean > 0) || (t.side === "def" && L.lean < 0);
      if(aligned) okTeams.push(t.name + " " + (L.lean>0?"+":"") + (L.lean*100).toFixed(0) + "%");
      else out.push({lv:"warn", t:t.name + " — 배정 입장과 시야가 어긋납니다 (" + sideLabel(t.side) + "인데 편향 " + (L.lean>0?"+":"") + (L.lean*100).toFixed(0) + "%)",
        d:"자기가 본 증거와 반대로 주장해야 합니다. 의도한 배신 구조가 아니라면 입장을 바꾸거나 경로를 조정하십시오."});
    }
  });
  if(okTeams.length) out.push({lv:"good", t:"배정 입장과 시야가 일치하는 팀 " + okTeams.length + "개",
    d:okTeams.join(" · ") + " — 본 것과 주장할 것이 맞아떨어져 진심으로 믿고 싸울 수 있습니다."});

  /* 7. 러닝타임 */
  var rt = totalRuntimeMin();
  if(rt > 100) out.push({lv:"warn", t:"예상 러닝타임 " + rt + "분 — 깁니다",
    d:"관객과의 대화까지 포함하면 100분을 넘깁니다. 라운드 시간이나 재판 시간을 줄이십시오."});
  else out.push({lv:"good", t:"예상 러닝타임 " + rt + "분", d:"조사 " + (S.cfg.rounds*S.cfg.roundMin) + "분 + 이동 " + (Math.max(0,S.cfg.rounds-1)*S.cfg.moveMin) + "분 + 재판 " + (S.trials.length*S.cfg.trialMin) + "분."});

  /* 8. 배우 반복 부담 */
  out.push({lv:"warn", t:"각 스테이션의 배우는 같은 장면을 " + S.cfg.rounds + "회 반복 공연합니다",
    d:"이동형 구조의 필연적 결과입니다. 장면당 " + S.cfg.roundMin + "분 × " + S.cfg.rounds + "회 = 배우 1인당 실연 " + (S.cfg.roundMin*S.cfg.rounds) + "분. 체력과 일관성을 리허설에서 반드시 확인하십시오."});

  var order = {crit:0, warn:1, good:2};
  return out.sort(function(a,b){ return order[a.lv] - order[b.lv]; });
}

/* ================= 운영 ================= */
function tallyOf(trial){
  var g = 0, ng = 0;
  S.teams.forEach(function(t,i){
    var v = trial.votes[t.id];
    if(!v) return;
    if(S.cfg.voteMode === "team"){
      if(v.choice === "g") g += 1; else if(v.choice === "ng") ng += 1;
    } else {
      g += Number(v.g)||0; ng += Number(v.ng)||0;
    }
  });
  var tot = g + ng;
  return { g:g, ng:ng, tot:tot,
    verdict: tot === 0 ? null : (g > ng ? "g" : ng > g ? "ng" : "tie") };
}
function verdictWord(v){ return v === "g" ? "유죄" : v === "ng" ? "무죄" : v === "tie" ? "동수" : "미집계"; }

function renderRun(){
  var root = document.getElementById("v-run");
  root.textContent = "";
  var c = S.cfg, run = S.run;

  /* 진행 바 */
  var pt = el("div",{class:"panel"});
  var ph = el("div",{class:"phase"});
  for(var r = 1; r <= c.rounds; r++){
    (function(rr){
      var b = el("button",{"aria-pressed": (run.phase==="invest" && run.round===rr) ? "true":"false",
        onclick:function(){ run.phase="invest"; run.round=rr; resetTimer(); save(); renderRun(); }});
      b.appendChild(el("b",{text:"조사 "+rr}));
      b.appendChild(el("small",{text:"ROUND "+rr}));
      ph.appendChild(b);
    })(r);
  }
  S.trials.forEach(function(t){
    var b = el("button",{"aria-pressed": (run.phase==="trial" && run.trialId===t.id) ? "true":"false",
      onclick:function(){ run.phase="trial"; run.trialId=t.id; resetTimer(); save(); renderRun(); }});
    b.appendChild(el("b",{text:t.label}));
    b.appendChild(el("small",{text:"조사 "+t.after+"회 후"}));
    ph.appendChild(b);
  });
  pt.appendChild(ph);

  /* 타이머 */
  var target = run.phase === "trial" ? c.trialMin : c.roundMin;
  var tw = el("div",{class:"row",style:"justify-content:space-between;align-items:flex-end;gap:16px"});
  var left = el("div");
  left.appendChild(el("div",{class:"mono",style:"font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)",
    text: (run.phase === "trial" ? (currentTrial()||{}).label + " 진행" : "조사 라운드 " + run.round) + " · 목표 " + target + "분"}));
  var over = run.elapsed > target*60;
  left.appendChild(el("div",{class:"clock"+(over?" over":""), id:"clockEl", text: fmt(run.elapsed)}));
  tw.appendChild(left);
  var ctrl = el("div",{class:"row"});
  ctrl.appendChild(el("button",{class:"btn pri",id:"playBtn",text: run.running ? "일시정지" : "시작",
    onclick:function(){ run.running = !run.running; if(run.running){ run.startedAt = Date.now() - run.elapsed*1000; } save(); renderRun(); }}));
  ctrl.appendChild(el("button",{class:"btn",text:"리셋",onclick:function(){ resetTimer(); save(); renderRun(); }}));
  tw.appendChild(ctrl);
  pt.appendChild(tw);
  root.appendChild(pt);

  if(run.phase === "invest") renderInvest(root);
  else renderTrial(root);

  /* 평결 추이 — 투표 입력 중에도 갱신되도록 별도 컨테이너 */
  root.appendChild(el("div",{id:"traceHost"}));
  renderTrace();
}

function renderTrace(){
  var host = document.getElementById("traceHost");
  if(!host) return;
  host.textContent = "";
  var any = S.trials.some(function(t){ return tallyOf(t).tot > 0; });
  if(!any) return;

  var pv = el("div",{class:"panel"});
  pv.appendChild(el("h2",{text:"평결 추이"}));
  pv.appendChild(el("p",{class:"sub",text:"1심에서 최종심까지 평결이 어떻게 뒤집혔는지가 이 공연의 서사입니다. 커튼콜에서 이 흐름을 공표하십시오."}));
  var tr = el("div",{class:"trace"});
  S.trials.forEach(function(t,i){
    var q = tallyOf(t);
    if(i) tr.appendChild(el("span",{class:"arw",text:"→"}));
    var box = el("div",{class:"tbox"});
    box.appendChild(el("small",{text:t.label}));
    var b = el("b",{text: verdictWord(q.verdict)});
    b.style.color = q.verdict==="g" ? "var(--pro)" : q.verdict==="ng" ? "var(--def)"
                  : q.verdict==="tie" ? "var(--warn)" : "var(--ink3)";
    box.appendChild(b);
    if(q.tot) box.appendChild(el("small",{class:"mono",style:"margin-top:3px",text:q.g+" : "+q.ng}));
    tr.appendChild(box);
  });
  pv.appendChild(tr);

  var fin = tallyOf(S.trials[S.trials.length-1]);
  if(fin.verdict && fin.verdict !== "tie"){
    var winSide = fin.verdict === "g" ? "pro" : "def";
    var winners = S.teams.filter(function(t){ return t.side === winSide; });
    pv.appendChild(el("p",{class:"hint",style:"margin-top:14px",
      html:"최종 평결 <b>"+verdictWord(fin.verdict)+"</b> — <b>"+ (winners.length ? winners.map(function(w){ return esc(w.name); }).join(", ") : "해당 입장의 팀 없음") +"</b> 측 주장이 관철되었습니다."}));
  }
  host.appendChild(pv);
}

function currentTrial(){
  for(var i=0;i<S.trials.length;i++) if(S.trials[i].id === S.run.trialId) return S.trials[i];
  return S.trials[0];
}
function fmt(sec){
  sec = Math.max(0, Math.floor(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function resetTimer(){ S.run.running = false; S.run.elapsed = 0; S.run.startedAt = null; }

  tb.appendChild(el("thead",{html: S.cfg.voteMode === "team"
    ? "<tr><th>팀</th><th style='width:110px'>배정 입장</th><th style='width:220px'>평결</th></tr>"

            save();
            /* 전체 재렌더는 누른 버튼을 DOM에서 떼어낸다 — 이 행만 갱신한다 */
            rowb.querySelectorAll("button").forEach(function(bn, bi){

function updateTally(t){
  var box = document.getElementById("tallyBox");
  if(!box) return;
  box.textContent = "";
  var q = tallyOf(t);
  if(q.tot === 0){
    box.appendChild(el("p",{class:"hint",text:"아직 집계된 표가 없습니다."}));
    return;
  }
  var bar = el("div",{class:"votebar"});
  var gp = q.g/q.tot*100, np = q.ng/q.tot*100;
  bar.appendChild(el("i",{class:"vg",style:"width:"+gp+"%",text: gp>13 ? "유죄 "+q.g : ""}));
  bar.appendChild(el("i",{class:"vn",style:"width:"+np+"%",text: np>13 ? "무죄 "+q.ng : ""}));
  box.appendChild(bar);
  box.appendChild(el("div",{class:"row",style:"justify-content:space-between;font-size:12px",html:
    "<span class='mono' style='color:var(--pro)'>유죄 "+q.g+" ("+gp.toFixed(0)+"%)</span>"+
    "<span class='mono muted'>총 "+q.tot+"표</span>"+
    "<span class='mono' style='color:var(--def)'>무죄 "+q.ng+" ("+np.toFixed(0)+"%)</span>"}));

  var v = el("div",{class:"verdict",style:"margin-top:14px"});
  v.appendChild(el("div",{class:"vl",text: t.label + " 평결"}));
  v.appendChild(el("div",{class:"vv "+(q.verdict==="g"?"g":q.verdict==="ng"?"ng":"tie"), text: verdictWord(q.verdict)}));
  v.appendChild(el("div",{class:"vs",text: q.g + " 대 " + q.ng + (q.verdict==="tie" ? " — 재판장 판단으로 넘어갑니다" : "")}));
  box.appendChild(v);

  if(q.verdict === "tie"){
    box.appendChild(el("p",{class:"hint",text:"동수 엔딩을 준비해두십시오. 가장 강렬한 결말을 여기에 배치하는 것을 권합니다."}));
  }
  renderTrace();
}

  });
  tb.appendChild(body); tw.appendChild(tb); p2.appendChild(tw);

  var miss = S.stations.filter(function(st){ return !seenSet(idx)[st.id]; });
  if(miss.length){
    p2.appendChild(el("p",{class:"hint",text:"이 팀이 끝까지 보지 못하는 증거 "+miss.length+"개가 있습니다. 인솔자만 알고 있으십시오 — 관객에게는 알리지 않습니다."}));
  }
  root.appendChild(p2);
}

/* ================= 공유 ================= */
function encodeShow(){
  var json = JSON.stringify({t:S.title, cfg:S.cfg, teams:S.teams, stations:S.stations, trials:S.trials.map(function(x){
    return {id:x.id, label:x.label, after:x.after, votes:{}, done:false}; })});
  var bytes = new TextEncoder().encode(json);
  var bin = "";
  bytes.forEach(function(b){ bin += String.fromCharCode(b); });
  return btoa(bin);
}
function decodeShow(code){
  var bin = atob(String(code).trim());
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  var o = JSON.parse(new TextDecoder().decode(bytes));
  if(!o.teams || !o.stations) throw new Error("형식이 올바르지 않습니다");
  return migrate({ title:o.t || "침묵의 증거", cfg:o.cfg, teams:o.teams, stations:o.stations, trials:o.trials, run:null });
}

/* ================= 배선 ================= */
function switchView(v){
  view = v;
  ["design","check","run","team"].forEach(function(k){
    document.getElementById("v-"+k).classList.toggle("hide", k !== v);
  });
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.setAttribute("aria-selected", b.dataset.view === v ? "true" : "false");
  });
  render();
}
function render(){
  if(view === "design") renderDesign();
  else if(view === "check") renderCheck();
  else if(view === "run") renderRun();
  else renderTeam();
}

document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener("click", function(){ switchView(b.dataset.view); });
});

/* 무대 모드 */
var stageBtn = document.getElementById("stageBtn");
try{
  if(localStorage.getItem("sv.stage") === "1"){
    document.documentElement.setAttribute("data-stage","on");
    stageBtn.setAttribute("aria-pressed","true");
  }
}catch(e){}
stageBtn.addEventListener("click", function(){
  var on = document.documentElement.getAttribute("data-stage") === "on";
  if(on){ document.documentElement.removeAttribute("data-stage"); stageBtn.setAttribute("aria-pressed","false"); }
  else { document.documentElement.setAttribute("data-stage","on"); stageBtn.setAttribute("aria-pressed","true"); }
  try{ localStorage.setItem("sv.stage", on ? "0" : "1"); }catch(e){}
});

/* 공유 다이얼로그 */
var dlg = document.getElementById("shareDlg");
document.getElementById("shareBtn").addEventListener("click", function(){
  document.getElementById("codeOut").value = encodeShow();
  if(typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open","");
});
dlg.querySelectorAll("[data-close]").forEach(function(b){
  b.addEventListener("click", function(){ dlg.close ? dlg.close() : dlg.removeAttribute("open"); });
});
document.getElementById("copyCode").addEventListener("click", function(){
  var ta = document.getElementById("codeOut");
  ta.select();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(function(){ toast("배포 코드를 복사했습니다"); },
      function(){ toast("복사에 실패했습니다 — 직접 선택해 복사하십시오"); });
  } else {
    try{ document.execCommand("copy"); toast("배포 코드를 복사했습니다"); }
    catch(e){ toast("직접 선택해 복사하십시오"); }
  }
});
document.getElementById("loadCode").addEventListener("click", function(){
  var v = document.getElementById("codeIn").value;
  if(!v.trim()){ toast("코드를 붙여넣으십시오"); return; }
  try{
    S = decodeShow(v);
    teamViewId = null;
    save();
    document.getElementById("codeIn").value = "";
    dlg.close ? dlg.close() : dlg.removeAttribute("open");
    render();
    toast("설계를 불러왔습니다");
  }catch(e){ toast("코드를 읽을 수 없습니다 — 전체를 복사했는지 확인하십시오"); }
});
document.getElementById("resetAll").addEventListener("click", function(){
  if(!confirm("현재 설계와 집계된 표를 모두 버리고 예시 설계로 되돌립니다. 계속할까요?")) return;
  S = defaultShow(); teamViewId = null; save();
  dlg.close ? dlg.close() : dlg.removeAttribute("open");
  render(); toast("예시 설계로 초기화했습니다");
});

/* JSON 파일 저장 — downloads 기능이 있을 때만 노출 */
var dlBtn = document.getElementById("dlJson");
dlBtn.classList.add("hide");
if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("downloads").then(function(d){
    if(!d || typeof d.save !== "function") return;
    dlBtn.classList.remove("hide");
    dlBtn.addEventListener("click", function(){
      var payload = JSON.stringify(S, null, 2);
      var name = "침묵의증거_설계_" + new Date().toISOString().slice(0,10) + ".json";
      Promise.resolve(d.save({ filename:name, data:payload })).then(
        function(){ toast("파일로 저장했습니다"); },
        function(){ toast("저장이 취소되었습니다"); });
    });
  }, function(){});
}

/* 타이머 루프 */
function tick(){
  var run = S.run;
  if(run.running && run.startedAt){
    run.elapsed = Math.floor((Date.now() - run.startedAt) / 1000);
    var c = document.getElementById("clockEl");
    if(c){
      c.textContent = fmt(run.elapsed);
      var target = (run.phase === "trial" ? S.cfg.trialMin : S.cfg.roundMin) * 60;
      c.classList.toggle("over", run.elapsed > target);
    }
  }
}
timerHandle = setInterval(tick, 500);
setInterval(function(){ if(S.run.running) save(); }, 5000);

render();
</script>
